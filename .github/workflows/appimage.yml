# AppImage для Linux / Steam Deck (0.4.2): сборка, дымовой тест и окно под xvfb.
# Запускается при каждом push в main (проверка, что AppImage собирается), вручную (Actions → AppImage → Run workflow)
# и из release.yml (workflow_call) — тогда файл попадает в релиз. Результат — артефакт release-appimage
# с файлом FF-Montage-<версия>-linux-x86_64.AppImage (это имя ждёт update.rs asset_name).
#
# Как собирается: tauri-cli (npx @tauri-apps/cli@2) с дополнительным конфигом .github/appimage.conf.json:
# bundle.active, targets=appimage, bundleMediaFramework (GStreamer внутри — для <video>), FFmpeg BtbN (SHA-256 проверяет
# tools/fetch-ffmpeg.sh) в usr/bin/ffmpeg/bin. Программа берёт FFmpeg из $APPDIR/usr/bin/ffmpeg (ff.rs search_binaries),
# данные — в системных папках XDG (paths.rs, D7), потому что AppImage только для чтения. Обновление из программы
# подменяет сам файл $APPIMAGE (update.rs).
# Проверки (tools/appimage-smoke.sh, tools/appimage-window.sh) пишут итог в аннотации ::notice/::error — их видно
# без входа на GitHub: api.github.com/repos/<репо>/check-runs/<id>/annotations.
name: AppImage
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'mcp/**', 'examples/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Тег или ветка для сборки (из release.yml — тег релиза)'
        type: string
        required: false

concurrency:
  group: appimage-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      FFM_NO_GPU: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      # gstreamer1.0-libav — декодер H.264/AAC для <video> (avdec_h264); -bad — AV1/HEVC-разборщики, -good — autoaudiosink,
      # MP4/MKV, pulsesink. bundleMediaFramework кладёт в образ все установленные плагины.
      - name: Библиотеки окна, GStreamer, FUSE и xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libfuse2 file jq xvfb \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: appimage
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Версия
        id: ver
        run: |
          node tools/check-version.mjs
          echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: FFmpeg (закреплённая сборка, проверка SHA-256)
        run: bash tools/fetch-ffmpeg.sh dist/appimage-ffmpeg
      - name: Сборка AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          set -o pipefail
          npx --yes @tauri-apps/cli@2 build --ci --bundles appimage --config .github/appimage.conf.json -- --locked 2>&1 | tee build.log || {
            grep -E 'error|Error|failed|ERROR' build.log | tail -n 8 | while IFS= read -r l; do echo "::error title=Сборка AppImage::$l"; done
            exit 1
          }
      - name: Переименовать
        run: |
          src="$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)"
          [ -n "$src" ] || { echo "::error::tauri не создал .AppImage"; ls -laR src-tauri/target/release/bundle || true; exit 1; }
          mkdir -p dist/out
          cp "$src" "dist/out/FF-Montage-${{ steps.ver.outputs.version }}-linux-x86_64.AppImage"
          chmod +x dist/out/*.AppImage
          ls -la dist/out
      - name: Дымовой тест (FFmpeg и GStreamer внутри, движок, пути XDG)
        run: bash tools/appimage-smoke.sh "dist/out/FF-Montage-${{ steps.ver.outputs.version }}-linux-x86_64.AppImage"
      # Для сравнения: тот же exe без AppImage, с GStreamer системы раннера (не влияет на результат)
      - name: Окно без AppImage под xvfb (сравнение)
        continue-on-error: true
        env:
          FFMPEG: dist/appimage-ffmpeg/bin/ffmpeg
        run: bash tools/appimage-window.sh src-tauri/target/release/ff-montage dist/plain-test
      - name: Окно под xvfb (<video> через GStreamer из образа)
        run: bash tools/appimage-window.sh "dist/out/FF-Montage-${{ steps.ver.outputs.version }}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v5
        with:
          name: release-appimage
          path: dist/out/*.AppImage
          if-no-files-found: error
      - name: Журналы
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logs-appimage
          path: |
            build.log
            dist/appimage-test/**
          if-no-files-found: ignore
