# Проверка при каждом push / pull request: стиль и clippy, сборка, юнит-тесты Rust, тест движка
# (без видеокарты — на процессоре), тест ИИ-ассистента (MCP); на Windows ещё автотест интерфейса.
name: CI
on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Быстрые проверки без FFmpeg: форматирование, clippy, перевод, таблица хоткеев, версии
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Библиотеки окна
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Форматирование (cargo fmt)
        working-directory: src-tauri
        run: cargo fmt --check
      # type_complexity — стилистика (типы колбэков в control/ff/fonts), остальное — ошибка
      # Ошибки — ещё и в аннотации (их видно через API без входа: check-runs/<id>/annotations)
      - name: Clippy
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets --message-format=short -- -D warnings -A clippy::type_complexity 2>&1 | tee clippy.log || {
            grep -E 'error|warning' clippy.log | grep -vE '^\s*(Compiling|Checking)' | head -n 12 | sed 's/^/::error title=Clippy::/'
            exit 1
          }
      - name: Перевод интерфейса (i18n)
        run: node tests/i18n-check.js
      - name: Правки таймлайна (edit-test, без FFmpeg и окна)
        run: node tests/edit-test.js
      - name: Таблица горячих клавиш (docs/HOTKEYS.md) актуальна
        run: node tools/hotkeys-doc.mjs --check
      - name: Версия одинакова в Cargo.toml, Cargo.lock, tauri.conf.json, package.json
        run: node tools/check-version.mjs

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FFM_NO_GPU: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: FFmpeg (закреплённая сборка, проверка SHA-256)
        shell: pwsh
        run: ./tools/fetch-ffmpeg.ps1
      - name: Перевод интерфейса (i18n)
        run: node tests/i18n-check.js
      - name: Сборка
        working-directory: src-tauri
        run: cargo build --release --locked
      - name: Юнит-тесты Rust (план экспорта, плагины, обновления)
        working-directory: src-tauri
        run: cargo test --release --locked
      - name: Тест движка (процессор, без NVENC)
        run: node tests/engine-test.js
      - name: Экранирование для графа FFmpeg
        run: node tests/ffescape-test.js
      - name: Раскладки кадра (пример-плагин)
        run: node tests/layouts-test.js
      - name: Субтитры (SRT / VTT / ASS) и реестр
        run: |
          node tests/subtitles-test.js
          node tests/registry-test.js
      - name: Автотест интерфейса
        shell: pwsh
        run: |
          foreach ($t in 'ui-selftest3', 'ui-selftest4', 'ui-selftest5', 'ui-selftest6', 'ui-selftest11', 'ui-selftest14', 'ui-selftest15', 'ui-selftest16') {
            ./tests/run-ui.ps1 $t -TimeoutSec 300 | Tee-Object -Variable out
            if ($out -cmatch 'FAIL|ERROR|TIMEOUT') { exit 1 }
          }
          ./tests/run-ui.ps1 ui-selftest11 -Lang en -TimeoutSec 300 | Tee-Object -Variable out
          if ($out -cmatch 'FAIL|ERROR|TIMEOUT') { exit 1 }
      - name: Тест ИИ-ассистента (MCP)
        run: node tests/mcp-test.js
      - name: Журналы
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logs-windows
          path: |
            .test-cache/**/logs/**
            .test-cache/tmp/uitest/*.png
            .test-cache/tmp/uitest/*.json
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      FFM_NO_GPU: '1'
    steps:
      - uses: actions/checkout@v5
      # libayatana-appindicator не нужен: трея в программе нет (tauri без feature tray-icon)
      - name: Библиотеки окна
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev gstreamer1.0-plugins-good xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: FFmpeg (закреплённая сборка, проверка SHA-256)
        run: bash tools/fetch-ffmpeg.sh
      - name: Сборка
        working-directory: src-tauri
        run: cargo build --release --locked
      - name: Юнит-тесты Rust (план экспорта, плагины, обновления)
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test --release --locked 2>&1 | tee test.log || {
            grep -E 'FAILED|error' test.log | grep -vE '^\s*Compiling' | head -n 10 | sed 's/^/::error title=cargo test::/'
            grep -A4 'panicked at' test.log | head -n 30 | tr '\n' ' ' | cut -c1-1500 | sed 's/^/::error title=cargo test (паника)::/'
            echo
            exit 1
          }
      - name: Тест движка (процессор)
        run: node tests/engine-test.js
      - name: Экранирование для графа FFmpeg
        run: node tests/ffescape-test.js
      - name: Раскладки кадра (пример-плагин)
        run: node tests/layouts-test.js
      - name: Субтитры (SRT / VTT / ASS) и реестр
        run: |
          node tests/subtitles-test.js
          node tests/registry-test.js
      - name: Тест ИИ-ассистента (MCP)
        run: xvfb-run -a node tests/mcp-test.js
      - name: Журналы
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logs-linux
          path: .test-cache/**/logs/**
          if-no-files-found: ignore
