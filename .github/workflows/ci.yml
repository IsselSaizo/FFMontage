# Проверка при каждом push / pull request: сборка, тест движка (без видеокарты — на процессоре),
# тест ИИ-ассистента (MCP); на Windows ещё автотест интерфейса.
name: CI
on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FFM_NO_GPU: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: FFmpeg
        shell: pwsh
        run: ./tools/fetch-ffmpeg.ps1
      - name: Перевод интерфейса (i18n)
        run: node tests/i18n-check.js
      - name: Сборка
        working-directory: src-tauri
        run: cargo build --release --locked
      - name: Юнит-тесты Rust (план экспорта, плагины)
        working-directory: src-tauri
        run: cargo test --release --locked
      - name: Тест движка (процессор, без NVENC)
        run: node tests/engine-test.js
      - name: Экранирование для графа FFmpeg
        run: node tests/ffescape-test.js
      - name: Раскладки кадра (пример-плагин)
        run: node tests/layouts-test.js
      - name: Субтитры (SRT / VTT / ASS) и реестр
        run: |
          node tests/subtitles-test.js
          node tests/registry-test.js
      - name: Автотест интерфейса
        shell: pwsh
        run: |
          foreach ($t in 'ui-selftest3', 'ui-selftest4', 'ui-selftest5', 'ui-selftest6', 'ui-selftest11', 'ui-selftest14', 'ui-selftest15') {
            ./tests/run-ui.ps1 $t -TimeoutSec 300 | Tee-Object -Variable out
            if ($out -match 'FAIL|ERROR|TIMEOUT') { exit 1 }
          }
          ./tests/run-ui.ps1 ui-selftest11 -Lang en -TimeoutSec 300 | Tee-Object -Variable out
          if ($out -match 'FAIL|ERROR|TIMEOUT') { exit 1 }
      - name: Тест ИИ-ассистента (MCP)
        run: node tests/mcp-test.js
      - name: Журналы
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logs-windows
          path: |
            .test-cache/**/logs/**
            .test-cache/tmp/uitest/*.png
            .test-cache/tmp/uitest/*.json
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      FFM_NO_GPU: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Библиотеки окна
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev gstreamer1.0-plugins-good xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: FFmpeg
        run: bash tools/fetch-ffmpeg.sh
      - name: Сборка
        working-directory: src-tauri
        run: cargo build --release --locked
      - name: Юнит-тесты Rust (план экспорта, плагины)
        working-directory: src-tauri
        run: cargo test --release --locked
      - name: Тест движка (процессор)
        run: node tests/engine-test.js
      - name: Экранирование для графа FFmpeg
        run: node tests/ffescape-test.js
      - name: Раскладки кадра (пример-плагин)
        run: node tests/layouts-test.js
      - name: Субтитры (SRT / VTT / ASS) и реестр
        run: |
          node tests/subtitles-test.js
          node tests/registry-test.js
      - name: Тест ИИ-ассистента (MCP)
        run: xvfb-run -a node tests/mcp-test.js
      - name: Журналы
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logs-linux
          path: .test-cache/**/logs/**
          if-no-files-found: ignore
