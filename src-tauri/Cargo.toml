[package]
name = "ff-montage"
version = "0.3.0"
description = "FF Montage вЂ” РІРёРґРµРѕСЂРµРґР°РєС‚РѕСЂ СЃ FFmpeg РїРѕРґ РєР°РїРѕС‚РѕРј"
license = "GPL-3.0-or-later"
edition = "2021"
default-run = "ff-montage"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "io-std", "net", "time", "sync", "macros", "rt-multi-thread", "fs"] }
percent-encoding = "2"
sha1 = "0.10"
getrandom = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
codegen-units = 4
