[package]
name = "ff-montage"
version = "0.4.0"
description = "FF Montage — видеоредактор с FFmpeg под капотом"
license = "GPL-3.0-or-later"
edition = "2021"
default-run = "ff-montage"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "io-std", "net", "time", "sync", "macros", "rt-multi-thread", "fs"] }
percent-encoding = "2"
sha1 = "0.10"
getrandom = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Globalization", "Win32_UI_Input_KeyboardAndMouse"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Инструменты разработчика WebView в release-сборке (F12): cargo build --release --features devtools.
# В debug-сборке Tauri включает их сам.
devtools = ["tauri/devtools"]

# M0.11: маленький exe. panic = "abort" сознательно НЕ включён: сейчас паника в одной команде или задаче пула
# media:// роняет только её (catch_unwind в protocol.rs), с abort закрылась бы вся программа.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

# Быстрая сборка для разработки и UI-тестов: cargo build --profile fast (тот же код, без LTO)
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 3
