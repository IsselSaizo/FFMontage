<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.45 system-ui, sans-serif; color: #e6e6ea; background: transparent; margin: 12px; }
    .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #ffffff14; }
    .muted { color: #9a9aa6; }
    textarea { width: 100%; box-sizing: border-box; min-height: 90px; margin-top: 10px; background: #1d1d23;
      color: inherit; border: 1px solid #ffffff22; border-radius: 6px; padding: 6px; font: inherit; resize: vertical; }
  </style>
</head>
<body>
  <div id="stats"></div>
  <textarea id="note"></textarea>
  <div class="muted" id="hint"></div>
  <script type="module" src="panel.js"></script>
</body>
</html>
