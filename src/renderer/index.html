<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'">
  <title>FF Montage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <main id="workspace">
      <aside id="media-panel" class="panel"></aside>
      <section id="center">
        <div id="preview"></div>
        <div id="transport"></div>

      <aside id="inspector" class="panel"></aside>
    </main>
    <div id="tl-resizer" title="Потяните, чтобы изменить высоту таймлайна"></div>
    <section id="timeline"></section>
  </div>
  <script type="module" src="js/app.js"></script>

</html>
