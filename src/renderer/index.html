<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>FF Montage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <main id="workspace">
      <aside id="media-panel" class="panel"></aside>
      <section id="center">
        <div id="preview"></div>
        <div id="transport"></div>
      </section>
      <aside id="right-side">
        <div class="rp-tabs" id="rp-tabs"></div>
        <div id="inspector" class="panel"></div>
        <div id="browse-transitions" class="panel" hidden></div>
        <div id="browse-effects" class="panel" hidden></div>
      </aside>
    </main>
    <div id="tl-resizer" title="Потяните, чтобы изменить высоту таймлайна"></div>
    <section id="timeline"></section>
  </div>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
